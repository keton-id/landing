<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0a0a0b"/>

  <!-- back faint outline cube -->
  <g transform="translate(8 -2)" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round" opacity="0.22">
    <polygon points="22,10 42,20 22,30 2,20"/>
    <polygon points="2,20 22,30 22,50 2,40"/>
    <polygon points="42,20 22,30 22,50 42,40"/>
  </g>

  <!-- mid outline cube -->
  <g transform="translate(4 2)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" opacity="0.7">
    <polygon points="22,10 42,20 22,30 2,20"/>
    <polygon points="2,20 22,30 22,50 2,40"/>
    <polygon points="42,20 22,30 22,50 42,40"/>
  </g>

  <!-- front emerald solid cube -->
  <g transform="translate(-2 8)">
    <polygon points="22,10 42,20 22,30 2,20" fill="#34c08a"/>
    <polygon points="2,20 22,30 22,50 2,40" fill="#34c08a" fill-opacity="0.7"/>
    <polygon points="42,20 22,30 22,50 42,40" fill="#34c08a" fill-opacity="0.45"/>
  </g>
</svg>
